<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Prova 3D</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600&family=Rye&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#0d0706;overflow:hidden;touch-action:none;font-family:"Oswald",system-ui,sans-serif;color:#f6ead6;-webkit-user-select:none;user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.lab{position:fixed;left:0;top:0;transform:translate(-50%,-50%);background:rgba(12,6,4,.82);border:1px solid #e8c36a;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:500;letter-spacing:.4px;white-space:nowrap;pointer-events:none;will-change:transform}
#hud{position:fixed;left:8px;right:8px;top:calc(8px + env(safe-area-inset-top,0px));background:rgba(8,4,3,.82);border:1px solid rgba(232,195,106,.35);border-radius:12px;padding:8px 10px;font-size:13px;line-height:1.35}
#hud b{color:#ffd37a}
#bar{position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));display:flex;gap:6px}
#bar button{flex:1;font:inherit;font-weight:600;font-size:13px;color:#1a0d07;background:linear-gradient(180deg,#ffd37a,#e08a2e);border:0;border-radius:10px;padding:10px 4px}
#toast{position:fixed;left:50%;bottom:calc(70px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:rgba(12,6,4,.92);border:1px solid #e8c36a;border-radius:12px;padding:8px 16px;font-size:15px;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
#err{position:fixed;inset:0;display:none;place-items:center;text-align:center;padding:30px;background:#0d0706;font-size:17px}
</style>
<script type="importmap">{"imports":{"three":"./vendor/three.module.min.js"}}</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="labs"></div>
<div id="hud">Carico la scena 3D…</div>
<div id="bar">
  <button id="bQ" type="button">Qualità: alta</button>
  <button id="bT" type="button">Test 10 s</button>
  <button id="bA" type="button">Animazioni: sì</button>
</div>
<div id="toast"></div>
<div id="err">Questo telefono non riesce ad aprire il 3D (WebGL non disponibile).<br>Resterebbe la sala 2D.</div>
<script type="module" src="prova3d.js?v=2"></script>
</body>
</html>
